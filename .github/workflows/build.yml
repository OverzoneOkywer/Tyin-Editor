name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            artifact: linux-x86_64
            package: tyin-editor-linux-x86_64.tar.gz
          - name: Windows
            os: windows-latest
            artifact: windows-x86_64
            package: tyin-editor-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            pkg-config

      - name: Build release binary
        run: cargo build --locked --release -p tyin-app

      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: tar -czf tyin-editor-linux-x86_64.tar.gz -C target/release tyin-app

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/tyin-app.exe -DestinationPath tyin-editor-windows-x86_64.zip

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: tyin-editor-${{ matrix.artifact }}-package
          path: ${{ matrix.package }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
