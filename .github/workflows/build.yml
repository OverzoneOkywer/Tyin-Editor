name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            artifact: linux-x86_64
            package: dist/tyin-editor_*_amd64.deb
          - name: Windows
            os: windows-latest
            artifact: windows-x86_64
            package: dist/Tyin-Editor-Setup-*-x64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            pkg-config

      - name: Build release binary
        run: cargo build --locked --release -p tyin-app

      - name: Package Linux installer
        if: runner.os == 'Linux'
        run: bash packaging/linux/build-deb.sh "$GITHUB_REF_NAME" "$GITHUB_REF_TYPE" "$GITHUB_RUN_NUMBER"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            "0.1.0-dev.$env:GITHUB_RUN_NUMBER"
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" packaging/windows/tyin-editor.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: tyin-editor-${{ matrix.artifact }}-package
          path: ${{ matrix.package }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish v0.1.2 release
        if: github.ref == 'refs/tags/v0.1.2'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          body_path: docs/releases/v0.1.2.md
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Publish v0.1.3 release
        if: github.ref == 'refs/tags/v0.1.3'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          body_path: docs/releases/v0.1.3.md
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Publish v0.1.4 release
        if: github.ref == 'refs/tags/v0.1.4'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          body_path: docs/releases/v0.1.4.md
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Publish other releases
        if: github.ref != 'refs/tags/v0.1.2' && github.ref != 'refs/tags/v0.1.3' && github.ref != 'refs/tags/v0.1.4'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
